# M4 tuning: prior weight w for B4, and (k, w) for L+P, on the past-question tuning set.
# Units and attachments come from the build split (past minus tuning). Retrieval only:
# the score is evidence hit averaged over the budgets, so no reader calls.
stage: tune
name: m4_tune
results_dir: results

data:
  hf_id: rajpurkar/squad
  split: validation
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.1
  pilot_size: 200

eval:
  questions: tuning
  budgets: [32, 64, 128, 256, 512, 1024]

tune:
  w: [0, 0.25, 0.5, 1, 2, 4]
  tau: [0, 0.8, 0.85, 0.9, 0.95]   # prior votes only for units whose best past question is this similar
  lp_k: [1, 2, 3]

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

reader:
  backend: llama_cpp
  model_path: data/models/qwen2.5-3b-instruct-q4_k_m.gguf
  n_ctx: 2048
  n_threads: 8
  n_batch: 512
  max_tokens: 32
  seed: 0

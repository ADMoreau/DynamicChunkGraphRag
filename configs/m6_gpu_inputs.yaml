# Inputs for the GPU benchmark (modal_app/gpu_bench.py): per pilot question, Provence's
# candidate paragraphs, the reranked methods' candidates and the logged reader contexts.
# Retrieval, prune and rerank settings match the eval runs.
stage: export
name: m6_gpu_inputs
results_dir: results

data:
  hf_id: rajpurkar/squad
  split: validation
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.1
  pilot_size: 200

eval:
  questions: pilot
  budgets: [32, 64, 128, 256, 512, 1024]

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

prune:                    # B2 only
  model_path: data/models/provence   # naver/provence-reranker-debertav3-v1 (CC BY-NC-ND)
  nltk_data: data/models/nltk
  top_n: 20               # retrieved paragraphs Provence reranks and prunes per question
  threshold: 0.1          # Provence default
  batch_size: 4
  n_threads: 8

rerank:                   # "+R" methods
  model: cross-encoder/ms-marco-MiniLM-L-6-v2   # 91 MB, Apache-2.0
  model_cache: data/models/st
  top_n: 30               # fused candidates re-scored per question
  batch_size: 32
  n_threads: 8

reader:
  backend: llama_cpp
  model_path: data/models/qwen2.5-3b-instruct-q4_k_m.gguf
  n_ctx: 2048
  n_threads: 8
  n_batch: 512
  max_tokens: 32
  seed: 0

export:
  provence_top_n: 20      # B2 used 20, B2-n5/B2-n10 the first 5/10 of these
  rerank_methods: [B3, L-k1]
  reader_logs: [results/m2_pilot.jsonl, results/m4_rerank_pilot.jsonl, results/m4_provence_topn_pilot.jsonl]
  reader_methods: [B2, B2-n5, B2-n10, B3+R, L-k1+R]
  reader_budgets: [32, 64, 128, 256, 512, 1024]

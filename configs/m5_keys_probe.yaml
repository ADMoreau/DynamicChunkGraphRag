# Key-layer probe: do small machine-facing keys (clauses, triples) that point to sentences
# retrieve the evidence better than sentence units (B3), and at what index size? Learned
# variant K-all-k1 adds fine keys only where past questions pointed.
# Retrieval only (evidence hit, context tokens, added latency); no reader calls.
stage: probe
name: m5_keys_probe
results_dir: results

data:
  hf_id: rajpurkar/squad
  split: validation
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.1
  pilot_size: 200

eval:
  questions: pilot
  methods: [B3, B3+R, K-clause, K-triple, K-all, K-all+R, K-all-k1, K-all-k1+R]
  budgets: [32, 64, 128, 256, 512, 1024]

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

prune:                    # B2 only
  model_path: data/models/provence   # naver/provence-reranker-debertav3-v1 (CC BY-NC-ND)
  nltk_data: data/models/nltk
  top_n: 20               # retrieved paragraphs Provence reranks and prunes per question
  threshold: 0.1          # Provence default
  batch_size: 4
  n_threads: 8

rerank:                   # "+R" methods
  model: cross-encoder/ms-marco-MiniLM-L-6-v2   # 91 MB, Apache-2.0
  model_cache: data/models/st
  top_n: 30               # fused candidates re-scored per question
  batch_size: 32
  n_threads: 8

reader:
  backend: llama_cpp
  model_path: data/models/qwen2.5-3b-instruct-q4_k_m.gguf
  n_ctx: 2048
  n_threads: 8
  n_batch: 512
  max_tokens: 32
  seed: 0

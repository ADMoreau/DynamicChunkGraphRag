# Candidate pairs for LLM same / related / different decisions (adjudicate.py), plus a
# stratified sample labelled by Claude as the reference for choosing the judging model.
stage: candidates
name: m9_adjudicate
results_dir: results

data:
  hf_id: rajpurkar/squad
  split: validation
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.1
  pilot_size: 200

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

prune:                    # B2 only
  model_path: data/models/provence   # naver/provence-reranker-debertav3-v1 (CC BY-NC-ND)
  nltk_data: data/models/nltk
  top_n: 20               # retrieved paragraphs Provence reranks and prunes per question
  threshold: 0.1          # Provence default
  batch_size: 4
  n_threads: 8

adjudicate:
  floor: 0.8                 # embedding cosine floor for candidates (HippoRAG's synonym threshold)
  fragment_k: [1, 1, 1]      # cracking k (sentence, clause, phrase) for fragment candidates
  label_sample: 250          # pairs in the reference set
  seed: 0

# HotpotQA held-out (200 pilot questions, never used for tuning): reranker baseline vs beam traversal
# (depth 1, chosen on h9) vs Provence (top 5, titles kept). Graph built from all past questions (h4_graph).
stage: probe
name: h11_heldout
results_dir: results

data:
  dataset: hotpotqa
  hf_id: hotpotqa/hotpot_qa
  split: validation
  n_questions: 2000        # seeded sample of the 7,405 validation questions; their paragraphs form the corpus
  sample_seed: 13
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.1
  pilot_size: 200

eval:
  questions: pilot
  methods: [C-ctx-k1-2-3+R, T-C123-b3-d1-k10, B2-n5]
  budgets: [64, 128, 256, 512]

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

prune:                    # B2 only
  model_path: data/models/provence   # naver/provence-reranker-debertav3-v1 (CC BY-NC-ND)
  nltk_data: data/models/nltk
  top_n: 20               # retrieved paragraphs Provence reranks and prunes per question
  threshold: 0.1          # Provence default
  use_titles: true        # as in the Provence paper
  batch_size: 4
  n_threads: 8

rerank:                   # "+R" methods
  model: cross-encoder/ms-marco-MiniLM-L-6-v2   # 91 MB, Apache-2.0
  model_cache: data/models/st
  top_n: 30               # fused candidates re-scored per question
  batch_size: 32
  n_threads: 8

reader:
  backend: llama_cpp
  model_path: data/models/qwen2.5-3b-instruct-q4_k_m.gguf
  n_ctx: 2048
  n_threads: 8
  n_batch: 512
  max_tokens: 32
  seed: 0

graph:
  unit_k: [1, 2, 3]          # cracking k (sentence, clause, phrase): leanest index, no retrieval loss in m7 tuning
  candidates: data/cache/merge/candidates_c3e238d583fda55e.jsonl
  verdicts: results/h3_judge_Qwen2.5-14B-Instruct.jsonl
  path: data/cache/graph/h4_graph.json   # traversal reads the built graph from here

# Node merging report (merge.py): entity resolution (exact, alias) and same-meaning merging
# for entities and cracked fragments, with sample merges per tier and threshold for review.
stage: merge
name: m8_merge
results_dir: results

data:
  hf_id: rajpurkar/squad
  split: validation
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.1
  pilot_size: 200

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

prune:                    # B2 only
  model_path: data/models/provence   # naver/provence-reranker-debertav3-v1 (CC BY-NC-ND)
  nltk_data: data/models/nltk
  top_n: 20               # retrieved paragraphs Provence reranks and prunes per question
  threshold: 0.1          # Provence default
  batch_size: 4
  n_threads: 8

merge:
  entity_taus: [0.85, 0.9, 0.95]     # cosine thresholds for the entity meaning tier
  fragment_taus: [0.85, 0.9, 0.95]
  fragment_k: [1, 1, 1]              # cracking k (sentence, clause, phrase) for fragments
  samples: 12                        # sample merges shown per tier and threshold

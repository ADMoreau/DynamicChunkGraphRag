# F1 check of the reranking probe: B3+R and L-k1+R with the reader, next to B1-B3 and O.
# Reader, retrieval, data and splits must match M1-M3 to compare with them.
stage: eval
name: m4_rerank_pilot
results_dir: results

data:
  hf_id: rajpurkar/squad
  split: validation
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.1
  pilot_size: 200

eval:
  questions: pilot
  methods: [B3+R, L-k1+R]
  compare_with: [results/m1_b1_pilot.jsonl, results/m2_pilot.jsonl, results/m3_oracle_pilot.jsonl]
  budgets: [32, 64, 128, 256, 512, 1024]

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

rerank:                   # "+R" methods
  model: cross-encoder/ms-marco-MiniLM-L-6-v2   # 91 MB, Apache-2.0
  model_cache: data/models/st
  top_n: 30               # fused candidates re-scored per question
  batch_size: 32
  n_threads: 8

reader:
  backend: llama_cpp
  model_path: data/models/qwen2.5-3b-instruct-q4_k_m.gguf
  n_ctx: 2048
  n_threads: 8
  n_batch: 512
  max_tokens: 32
  seed: 0

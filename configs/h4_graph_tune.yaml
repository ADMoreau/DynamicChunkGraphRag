# HotpotQA tuning copy: build the retrieval graph (graph.py): cracked text units (context-indexed), concept nodes
# merged from identical strings and Qwen 14B SAME verdicts, typed related / adjacent / mentions edges.
stage: graph
name: h4_graph_tune
results_dir: results

data:
  dataset: hotpotqa
  hf_id: hotpotqa/hotpot_qa
  split: validation
  n_questions: 2000        # seeded sample of the 7,405 validation questions; their paragraphs form the corpus
  sample_seed: 13
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.1
  pilot_size: 200

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

prune:                    # B2 only
  model_path: data/models/provence   # naver/provence-reranker-debertav3-v1 (CC BY-NC-ND)
  nltk_data: data/models/nltk
  top_n: 20               # retrieved paragraphs Provence reranks and prunes per question
  threshold: 0.1          # Provence default
  batch_size: 4
  n_threads: 8

eval:
  questions: tuning          # units cracked from the build split only (tuning questions unseen)
graph:
  unit_k: [1, 2, 3]          # cracking k (sentence, clause, phrase): leanest index, no retrieval loss in m7 tuning
  candidates: data/cache/merge/candidates_c3e238d583fda55e.jsonl
  verdicts: results/h3_judge_Qwen2.5-14B-Instruct.jsonl
  path: data/cache/graph/h4_graph_tune.json   # traversal reads the built graph from here

# Core-count sensitivity check for m4_cost_bench: the same benchmark on 2 physical cores
# (run with RAGSPLIT_CPUS=0-3 scripts/run_limited.sh ...), every model at 4 threads to match
# the 4 logical CPUs. Shows which way the time ratios move with fewer cores.
# Reader, retrieval, prune and rerank settings match the eval runs (m2_pilot, m4_rerank_pilot).
stage: bench
name: m4_cost_bench_2core
results_dir: results

data:
  hf_id: rajpurkar/squad
  split: validation
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.1
  pilot_size: 200

eval:
  questions: pilot
  budgets: [32, 64, 128, 256, 512, 1024]

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

prune:                    # B2 only
  model_path: data/models/provence   # naver/provence-reranker-debertav3-v1 (CC BY-NC-ND)
  nltk_data: data/models/nltk
  top_n: 20               # retrieved paragraphs Provence reranks and prunes per question
  threshold: 0.1          # Provence default
  batch_size: 4
  n_threads: 4

rerank:                   # "+R" methods
  model: cross-encoder/ms-marco-MiniLM-L-6-v2   # 91 MB, Apache-2.0
  model_cache: data/models/st
  top_n: 30               # fused candidates re-scored per question
  batch_size: 32
  n_threads: 4

reader:
  backend: llama_cpp
  model_path: data/models/qwen2.5-3b-instruct-q4_k_m.gguf
  n_ctx: 2048
  n_threads: 4
  n_batch: 512
  max_tokens: 32
  seed: 0

bench:
  n_questions: 20         # first 20 pilot questions (same as the first 20 of m4_cost_bench)
  warmup: 3               # not counted (model warm-up, first-call allocation)
  variants:               # prune/rerank step; B2 options override the prune block
    - {name: B2, method: B2}                          # as run: top 20 paragraphs, batch 4
    - {name: B2-n10, method: B2-n10}                  # cheaper Provence: top 10 paragraphs
    - {name: B2-n5, method: B2-n5}                    # top 5 paragraphs
    - {name: B3+R, method: B3+R}
    - {name: L-k1+R, method: L-k1+R}
  reader_logs: [results/m2_pilot.jsonl, results/m4_rerank_pilot.jsonl, results/m4_provence_topn_pilot.jsonl]
  reader_methods: [B2, B2-n10, B2-n5, B3+R, L-k1+R]
  reader_budgets: [128, 256]
  reference: B2
  reader_non_embedding_params: 2.77e9   # Qwen2.5-3B (model card: 3.09B total, 2.77B non-embedding)

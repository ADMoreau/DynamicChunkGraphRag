# MuSiQue-Ans dev (2-4 hops) pooled corpus: flat baselines and Provence (top 5, titles kept) on the
# tuning questions. spans_located = every hop's answer reached the reader from its own paragraph.
stage: probe
name: q1_baselines_tune
results_dir: results

data:
  dataset: musique
  hf_id: dgslibisey/MuSiQue      # musique_ans_v1.0_dev.jsonl
  split: dev
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.2       # ~338 tuning questions
  pilot_size: 200

eval:
  questions: tuning
  methods: [B1+R, B3+R, B2-n5]
  budgets: [64, 128, 256, 512]

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

prune:                    # B2 only
  model_path: data/models/provence   # naver/provence-reranker-debertav3-v1 (CC BY-NC-ND)
  nltk_data: data/models/nltk
  top_n: 20               # retrieved paragraphs Provence reranks and prunes per question
  threshold: 0.1          # Provence default
  use_titles: true        # as in the Provence paper
  batch_size: 4
  n_threads: 8

rerank:                   # "+R" methods
  model: cross-encoder/ms-marco-MiniLM-L-6-v2   # 91 MB, Apache-2.0
  model_cache: data/models/st
  top_n: 30               # fused candidates re-scored per question
  batch_size: 32
  n_threads: 8

reader:
  backend: llama_cpp
  model_path: data/models/qwen2.5-3b-instruct-q4_k_m.gguf
  n_ctx: 2048
  n_threads: 8
  n_batch: 512
  max_tokens: 32
  seed: 0


# M1: B1 (paragraphs) end to end on the 200-question pilot slice.
stage: eval
name: m1_b1_pilot
results_dir: results

data:
  hf_id: rajpurkar/squad
  split: validation
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.1
  pilot_size: 200

eval:
  questions: pilot        # pilot | future | tuning
  methods: [B1]
  budgets: [32, 64, 128, 256, 512, 1024]   # 32 and 64 added in M3 for Gate A

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100              # per-list depth and fused list length
  rrf_k: 60

reader:
  backend: llama_cpp
  model_path: data/models/qwen2.5-3b-instruct-q4_k_m.gguf
  n_ctx: 2048
  n_threads: 8
  n_batch: 512
  max_tokens: 32
  seed: 0

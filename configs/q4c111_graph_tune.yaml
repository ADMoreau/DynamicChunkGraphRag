# MuSiQue tuning copy: build the retrieval graph (graph.py): cracked text units (context-indexed), concept nodes
# merged from identical strings and Qwen 14B SAME verdicts, typed related / adjacent / mentions edges.
stage: graph
name: q4c111_graph_tune
results_dir: results

data:
  dataset: musique
  hf_id: dgslibisey/MuSiQue      # musique_ans_v1.0_dev.jsonl
  split: dev
  data_dir: data
  spacy_model: en_core_web_sm

splits:
  seed: 13
  past_frac: 0.7
  tuning_frac: 0.2       # ~338 tuning questions
  pilot_size: 200


retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  model_cache: data/models/st
  depth: 100
  rrf_k: 60

prune:                    # B2 only
  model_path: data/models/provence   # naver/provence-reranker-debertav3-v1 (CC BY-NC-ND)
  nltk_data: data/models/nltk
  top_n: 20               # retrieved paragraphs Provence reranks and prunes per question
  threshold: 0.1          # Provence default
  batch_size: 4
  n_threads: 8

eval:
  questions: tuning          # units cracked from the build split only (tuning questions unseen)
graph:
  units: sentence_base      # sentences everywhere + learned finer cuts where past questions point
  unit_k: [1, 1, 1]          # cracking k (sentence, clause, phrase): leanest index, no retrieval loss in m7 tuning
  candidates: data/cache/merge/candidates_77d025ab98bc0219.jsonl
  verdicts: results/q3_judge_Qwen2.5-14B-Instruct.jsonl
  path: data/cache/graph/q4c111_graph_tune.json   # traversal reads the built graph from here
